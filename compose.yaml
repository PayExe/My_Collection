services:
  postgres:
    image: postgres:16-alpine
    container_name: ma-collection-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ma_collection}
      POSTGRES_USER: ${POSTGRES_USER:-collection_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collection_password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-collection_user} -d ${POSTGRES_DB:-ma_collection}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
